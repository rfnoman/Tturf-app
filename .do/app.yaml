# DigitalOcean App Platform specification (Phase 11 step 8, DECISIONS D71).
#
# Apply with:  doctl apps create --spec .do/app.yaml
# Update with: doctl apps update <app-id> --spec .do/app.yaml
#
# Region BLR1 (Bangalore) throughout: it is the nearest DigitalOcean region to Dhaka,
# roughly 40-60ms, and a booking page that waits on a round trip to Frankfurt is a
# booking page nobody uses on a 3G connection.
#
# Three services from one Dockerfile. They run the same code and the same dependencies
# and differ only in their command — three images would be three things to keep in step,
# and the day they drift is the day beat runs last week's business rules.

name: turfapp
region: blr

# ---------------------------------------------------------------------------
# Managed data services. Not containers: the backup story, the failover story and the
# upgrade story are all better handled by somebody whose job it is.
# ---------------------------------------------------------------------------
databases:
  - name: turf-db
    engine: PG
    version: "17"
    production: true
    cluster_name: turfapp-db
    # PostGIS is an extension on the cluster, and it is not enabled by default. After
    # the cluster exists, once:
    #   CREATE EXTENSION IF NOT EXISTS postgis;
    #   CREATE EXTENSION IF NOT EXISTS btree_gist;
    # `btree_gist` is not optional — the bookings exclusion constraint needs it, because
    # uuid has no default GiST operator class (DECISIONS D29).

  - name: turf-redis
    engine: REDIS
    version: "7"
    production: true
    cluster_name: turfapp-redis

# ---------------------------------------------------------------------------
# Migrations run before the new code is live, not alongside it. A deploy that starts
# serving requests against a schema it has not migrated yet is a deploy that fails in
# whichever request arrives first.
# ---------------------------------------------------------------------------
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    github:
      repo: rfnoman/Tturf-app
      branch: main
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    run_command: python manage.py migrate --noinput
    envs:
      - {key: DJANGO_SETTINGS_MODULE, value: config.settings.prod}
      - {key: DATABASE_URL, value: "${turf-db.DATABASE_URL}"}
      - {key: REDIS_URL, value: "${turf-redis.DATABASE_URL}"}
      - {key: DJANGO_SECRET_KEY, type: SECRET, value: "${DJANGO_SECRET_KEY}"}
      - {key: DJANGO_ALLOWED_HOSTS, value: "${APP_DOMAIN}"}

services:
  - name: api
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 8000
    github:
      repo: rfnoman/Tturf-app
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    health_check:
      # Reports the database, the cache and the workers — "can it serve", not "is the
      # process alive" (Phase 11 step 5). It answers 503 when Redis is gone, which is
      # what stops the platform routing traffic to an instance that cannot work.
      http_path: /api/v1/health
      initial_delay_seconds: 30
      period_seconds: 30
      failure_threshold: 3
    routes:
      - path: /api
      - path: /admin
      - path: /static
    envs: &backend_env
      - {key: DJANGO_SETTINGS_MODULE, value: config.settings.prod}
      - {key: DATABASE_URL, value: "${turf-db.DATABASE_URL}"}
      - {key: REDIS_URL, value: "${turf-redis.DATABASE_URL}"}
      - {key: CELERY_BROKER_URL, value: "${turf-redis.DATABASE_URL}"}
      - {key: CELERY_RESULT_BACKEND, value: "${turf-redis.DATABASE_URL}"}
      - {key: DJANGO_ALLOWED_HOSTS, value: "${APP_DOMAIN}"}
      - {key: DJANGO_LOG_FORMAT, value: json}
      - {key: SENTRY_RELEASE, value: "${APP_REVISION}"}
      - {key: SENTRY_ENVIRONMENT, value: production}

      # Secrets. Set each once with `doctl apps update --spec` after filling them in, or
      # in the control panel; they are encrypted at rest and never printed.
      - {key: DJANGO_SECRET_KEY, type: SECRET, value: "${DJANGO_SECRET_KEY}"}
      - {key: CLERK_SECRET_KEY, type: SECRET, value: "${CLERK_SECRET_KEY}"}
      - {key: CLERK_WEBHOOK_SIGNING_SECRET, type: SECRET, value: "${CLERK_WEBHOOK_SIGNING_SECRET}"}
      - {key: SSLCOMMERZ_STORE_ID, type: SECRET, value: "${SSLCOMMERZ_STORE_ID}"}
      - {key: SSLCOMMERZ_STORE_PASSWORD, type: SECRET, value: "${SSLCOMMERZ_STORE_PASSWORD}"}
      - {key: VAPID_PRIVATE_KEY, type: SECRET, value: "${VAPID_PRIVATE_KEY}"}
      - {key: SENTRY_DSN, type: SECRET, value: "${SENTRY_DSN}"}
      - {key: AWS_SECRET_ACCESS_KEY, type: SECRET, value: "${SPACES_SECRET}"}

      # Clerk, and the frontend origins its tokens may come from. A token whose `azp` is
      # not listed is rejected — which is correct, and is also the single most likely
      # reason a working staging deploy stops authenticating in production.
      - {key: CLERK_FRONTEND_API_URL, value: "${CLERK_FRONTEND_API_URL}"}
      - {key: CLERK_ISSUER, value: "${CLERK_FRONTEND_API_URL}"}
      - {key: CLERK_AUTHORIZED_PARTIES, value: "${SITE_URL}"}
      - {key: CORS_ALLOWED_ORIGINS, value: "${SITE_URL}"}

      # Media on Spaces: S3-compatible, so the same settings would drive R2 or S3 if this
      # ever moves (DECISIONS D71).
      - {key: AWS_STORAGE_BUCKET_NAME, value: "${SPACES_BUCKET}"}
      - {key: AWS_S3_ENDPOINT_URL, value: "https://blr1.digitaloceanspaces.com"}
      - {key: AWS_S3_REGION_NAME, value: blr1}
      - {key: AWS_S3_CUSTOM_DOMAIN, value: "${SPACES_BUCKET}.blr1.cdn.digitaloceanspaces.com"}
      - {key: AWS_ACCESS_KEY_ID, value: "${SPACES_KEY}"}

      - {key: VAPID_PUBLIC_KEY, value: "${VAPID_PUBLIC_KEY}"}
      - {key: VAPID_CONTACT_EMAIL, value: "${SUPPORT_EMAIL}"}
      - {key: SSLCOMMERZ_SANDBOX, value: "false"}

  - name: worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    github:
      repo: rfnoman/Tturf-app
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    run_command: celery -A config worker --loglevel=info --concurrency=4
    envs: *backend_env

  - name: beat
    # Exactly one, and this is the one number in the file that must not be raised. Two
    # beats mean every timer fires twice: two hold-expiry sweeps, two weekly recaps. The
    # jobs are idempotent per match and per week, not per run.
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    github:
      repo: rfnoman/Tturf-app
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    run_command: celery -A config beat --loglevel=info
    envs: *backend_env

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
