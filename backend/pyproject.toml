[project]
name = "turfapp-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.7",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.32",
    "svix>=2.9.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.2.0",
    "pytest-cov>=7",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF012",  # Django class attrs are conventionally mutable
    # Docs and comments quote DOMAIN.md, which uses § and en dashes deliberately.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # star-imports are the settings idiom
# Tests destructure fixture helpers that return several objects and often need only
# some of them; renaming the rest to `_thing` reads worse than leaving them named.
"**/tests/*.py" = ["RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["apps"]
# PostGIS test-database creation is slow; reuse it and pass --create-db after migrations change.
addopts = "--reuse-db --strict-markers -q"
